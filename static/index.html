<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0c0f">
  <title>Film Club</title>
  <!-- Resolve the theme BEFORE the stylesheet loads, so the first paint is already
       correct. Anything applied from app.js would land after paint and flash.
       The stored value is only a mirror; the account is the source of truth and
       reconciles once /api/me resolves. -->
  <script>
    (function () {
      var resolved = "dark";
      try {
        var pref = localStorage.getItem("fc_theme");
        if (pref !== "dark" && pref !== "light") {
          pref = "system";  // anything unrecognised or absent
        }
        resolved = pref === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : pref;
      } catch (e) {
        // Storage can throw outright in some privacy modes. Degrade to the OS
        // preference rather than leaving the page unthemed.
        try {
          resolved = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e2) { /* keep the dark default */ }
      }
      document.documentElement.setAttribute("data-theme", resolved);
      // Duplicates one pair of hex values from styles.css because this runs
      // before the stylesheet is guaranteed applied; app.js reads the real
      // token from CSS thereafter, so these two can never drift far.
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", resolved === "light" ? "#f7f7f9" : "#0c0c0f");
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v=70">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app"><div class="boot">Loading…</div></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/static/app.js?v=73"></script>
</body>
</html>
